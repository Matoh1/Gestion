server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: jedi-service
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/v1/jedis/**

            - id: sables-service
              uri: http://127.0.0.1:8082
              predicates:
                - Path=/api/v1/sables/**