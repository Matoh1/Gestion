server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Microservicio Incidencias (puerto 8083): expone reportes, detalles y tipos.
            - id: incidencias-service
              uri: http://127.0.0.1:8083
              predicates:
                - Path=/api/v1/incidencias/**,/api/v1/incidencia/**,/api/v1/tipo_incidencias/**

            - id: residencia-service
              uri: lb://residencia
              predicates:
                - Path=/api/v1/residencia/**,/api/v1/comuna/**,/api/v1/region/**,/api/v1/residencias/**

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    urls:
      - name: Microservicio Residencias
        url: /residencias/api-docs
      - name: Microservicio Incidencias
        url: /incidencias/api-docs
        
      - name: Microservicio Espacios
        url: /espacios/api-docs
  api-docs:
    enabled: true